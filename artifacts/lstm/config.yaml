dataset: datasets/lstm_all_scenarios.csv
lstm:
  batch_size: 128
  dropout: 0.2
  early_stopping_patience: 7
  epochs: 50
  hidden_dim: 128
  input_dim: 24
  learning_rate: 0.001
  num_layers: 2
  stride: 1
  weight_decay: 0.0001
  window_size: 30
seed: 42
system:
  cuda_available: false
  device: cpu
  gpu_name: null
  python_version: 3.13.14
  pytorch_version: !!python/object/new:torch.torch_version.TorchVersion
  - 2.10.0+cpu
