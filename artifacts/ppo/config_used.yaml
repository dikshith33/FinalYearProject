gat_checkpoint: artifacts/gat/spatial/gat_best.pt
lstm_checkpoint: artifacts/lstm/lstm_best.pt
gat_scaler: artifacts/gat/spatial/feature_scaler.pkl
lstm_scaler: artifacts/lstm/feature_scaler.pkl
output_dir: artifacts/ppo
max_hops: 20
num_actions: 100
rollout_steps: 2048
gamma: 0.99
gae_lambda: 0.95
epochs_per_update: 5
minibatch_size: 64
lr: 0.0001
clip_range: 0.15
value_loss_coef: 0.5
entropy_coef: 0.001
max_grad_norm: 0.5
target_kl: 0.015
lr_annealing: true
hidden_dim: 256
num_hidden_layers: 2
total_timesteps: 1000000
seed: 42
log_interval: 10
save_interval: 50
device: cpu
obs_dim: 256
use_action_mask: true
use_progress_reward: true
include_dst_embedding: true
prevent_loops: true
